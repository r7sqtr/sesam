[package]
name = "sesam"
version = "0.1.1"
description = "Summonable file manager for macOS"
authors = ["r7sqtr"]
edition = "2021"

[lib]
name = "sesam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
trash = "5.2.6"
tauri-plugin-drag = "2.1.1"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.53.1", features = ["sync"] }
objc2-quick-look-thumbnailing = "0.3.2"
block2 = "0.6.2"
objc2-core-foundation = "0.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
nucleo-matcher = "0.3.1"
zip = "8.6.0"

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[profile.release]
lto = true
codegen-units = 1
strip = true
